<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソニー公式 更新情報ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-black text-white py-6 shadow-md mb-8">
    <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bell text-blue-400"></i> ソニー公式 更新情報
        </h1>
        <p class="text-xs text-gray-400 mt-1">リポジトリ内の news.xml を直接読み込んで表示中</p>
      </div>
      <button onclick="loadNewsXml()" id="refresh-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-rotate"></i> 再読み込み
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4">
    <!-- カテゴリ選択タブ -->
    <div class="flex gap-2 mb-6 border-b border-gray-300 pb-3 overflow-x-auto" id="filter-tabs">
      <button onclick="filterCategory('all', event)" class="tab-btn bg-gray-800 text-white px-4 py-1.5 rounded-full text-sm font-medium">すべて</button>
      <button onclick="filterCategory('press', event)" class="tab-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-1.5 rounded-full text-sm font-medium">プレスリリース</button>
      <button onclick="filterCategory('product', event)" class="tab-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-1.5 rounded-full text-sm font-medium">製品ニュース</button>
    </div>

    <!-- ステータス・ローディング -->
    <div id="status" class="text-center py-8 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p class="mt-2 text-sm">リポジトリから news.xml を読み込んでいます...</p>
    </div>

    <!-- 記事一覧リスト -->
    <div id="news-container" class="grid gap-4"></div>
  </main>

  <script>
    let allItems = [];
    let currentCategory = 'all';

    function getReadIds() {
      return JSON.parse(localStorage.getItem('sony_read_ids') || '[]');
    }

    function markAsRead(guid) {
      const readIds = getReadIds();
      if (!readIds.includes(guid)) {
        readIds.push(guid);
        localStorage.setItem('sony_read_ids', JSON.stringify(readIds));
        renderNews();
      }
    }

    // リポジトリ直下の news.xml を直接取得してパース
    async function loadNewsXml() {
      const statusEl = document.getElementById('status');
      const refreshBtn = document.getElementById('refresh-btn');
      statusEl.classList.remove('hidden');
      refreshBtn.disabled = true;

      try {
        // キャッシュ対策としてクエリパラメータを付与
        const response = await fetch('./news.xml?t=' + new Date().getTime());
        
        if (!response.ok) {
          throw new Error(`HTTP status ${response.status}`);
        }

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('XMLパースエラー');
        }

        const items = xmlDoc.querySelectorAll('item');
        allItems = [];

        items.forEach(item => {
          const title = item.querySelector('title')?.textContent || 'タイトルなし';
          const link = item.querySelector('link')?.textContent || '#';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          const description = item.querySelector('description')?.textContent || '';
          const category = item.querySelector('category')?.textContent || 'news';
          const guid = item.querySelector('guid')?.textContent || link;

          let feedId = 'product';
          let feedName = '製品ニュース';
          if (category === 'press' || link.includes('News/Press') || title.includes('プレス')) {
            feedId = 'press';
            feedName = 'プレスリリース';
          }

          const cleanDesc = description.replace(/<[^>]*>?/gm, '').trim();

          allItems.push({
            id: guid.trim(),
            title: title.trim(),
            link: link.trim(),
            pubDate: pubDate.trim(),
            description: cleanDesc,
            feedId,
            feedName
          });
        });

        // 最新順に並び替え
        allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

        statusEl.classList.add('hidden');
        renderNews();
      } catch (err) {
        console.error('news.xml 読み込みエラー:', err);
        statusEl.innerHTML = `
          <div class="bg-amber-50 text-amber-800 p-5 rounded-xl border border-amber-200 max-w-lg mx-auto text-left">
            <div class="flex items-center gap-2 font-bold text-base mb-2 text-amber-900">
              <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> news.xml がまだ生成されていません
            </div>
            <p class="text-xs leading-relaxed mb-3">
              GitHub Actionsが未実行のため、リポジトリ内に <code>news.xml</code> が存在していません。
            </p>
            <div class="bg-amber-100/60 p-3 rounded text-xs space-y-1 font-mono text-amber-950">
              <p>1. GitHubの「Actions」タブを開く</p>
              <p>2. 「Fetch Sony RSS to news.xml」を選択</p>
              <p>3. 「Run workflow」を押して実行してください</p>
            </div>
          </div>`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      const readIds = getReadIds();
      container.innerHTML = '';

      const filtered = currentCategory === 'all' 
        ? allItems 
        : allItems.filter(item => item.feedId === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-12 bg-white rounded-xl border border-gray-200">表示できる記事がありません。</p>';
        return;
      }

      filtered.forEach(item => {
        const isRead = readIds.includes(item.id);
        const itemDate = new Date(item.pubDate);
        const dateStr = isNaN(itemDate) ? item.pubDate : itemDate.toLocaleDateString('ja-JP', {
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        const isNew = !isNaN(itemDate) && (new Date() - itemDate) < (7 * 24 * 60 * 60 * 1000);

        const card = document.createElement('div');
        card.className = `bg-white p-5 rounded-xl border ${isRead ? 'opacity-60 border-gray-200' : 'border-gray-300 shadow-sm'} hover:shadow-md transition`;

        card.innerHTML = `
          <div class="flex items-center gap-2 mb-2 text-xs">
            <span class="bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded">${item.feedName}</span>
            ${dateStr ? `<span class="text-gray-400"><i class="fa-regular fa-clock"></i> ${dateStr}</span>` : ''}
            ${isNew && !isRead ? '<span class="bg-red-500 text-white font-bold px-2 py-0.5 rounded text-[10px]">NEW</span>' : ''}
          </div>
          <h2 class="text-base font-bold text-gray-900 mb-2 hover:text-blue-600">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" onclick="markAsRead('${item.id}')">${item.title}</a>
          </h2>
          ${item.description ? `<p class="text-xs text-gray-600 line-clamp-2 mb-3 leading-relaxed">${item.description}</p>` : ''}
          <div class="flex justify-between items-center text-xs pt-3 border-t border-gray-100">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" onclick="markAsRead('${item.id}')" class="text-blue-600 font-medium hover:underline flex items-center gap-1">
              公式サイトで開く <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
            ${!isRead ? `<button onclick="markAsRead('${item.id}')" class="text-gray-400 hover:text-gray-600">既読にする</button>` : '<span class="text-gray-400">既読済み</span>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat, event) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-gray-800', 'text-white');
        btn.classList.add('bg-white', 'text-gray-700');
      });
      event.target.classList.remove('bg-white', 'text-gray-700');
      event.target.classList.add('bg-gray-800', 'text-white');
      renderNews();
    }

    loadNewsXml();
  </script>
</body>
</html>
