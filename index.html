<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ソニー公式 更新情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-12">

  <header class="bg-black text-white py-6 shadow-md mb-8">
    <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
          <i class="fa-solid fa-bell text-blue-400"></i> ソニー公式 更新情報
        </h1>
        <p class="text-xs text-gray-400 mt-1" id="last-update">データ取得中...</p>
      </div>
      <button onclick="loadNewsData()" id="refresh-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-rotate"></i> 再読み込み
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4">
    <div class="flex gap-2 mb-6 border-b border-gray-300 pb-3 overflow-x-auto">
      <button onclick="filterCategory('all', event)" class="tab-btn bg-gray-800 text-white px-4 py-1.5 rounded-full text-sm font-medium">すべて</button>
      <button onclick="filterCategory('press', event)" class="tab-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-1.5 rounded-full text-sm font-medium">プレスリリース</button>
      <button onclick="filterCategory('product', event)" class="tab-btn bg-white text-gray-700 hover:bg-gray-200 px-4 py-1.5 rounded-full text-sm font-medium">製品ニュース</button>
    </div>

    <div id="status" class="text-center py-8 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p class="mt-2 text-sm">最新データを読み込んでいます...</p>
    </div>

    <div id="news-container" class="grid gap-4"></div>
  </main>

  <script>
    let allItems = [];
    let currentCategory = 'all';

    async function loadNewsData() {
      const statusEl = document.getElementById('status');
      const lastUpdateEl = document.getElementById('last-update');
      statusEl.classList.remove('hidden');

      try {
        const response = await fetch('./sony_news.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('データが見つかりません');

        const data = await response.json();
        allItems = data.items || [];

        if (data.updatedAt) {
          const updateDate = new Date(data.updatedAt);
          lastUpdateEl.textContent = `最終更新: ${updateDate.toLocaleString('ja-JP')}`;
        }

        statusEl.classList.add('hidden');
        renderNews();
      } catch (err) {
        statusEl.innerHTML = `<p class="text-red-500 text-sm py-4">データ（sony_news.json）の読み込みに失敗しました。</p>`;
      }
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '';

      const filtered = currentCategory === 'all' 
        ? allItems 
        : allItems.filter(item => item.feedId === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 py-12 bg-white rounded-xl border border-gray-200">表示できる記事がありません。</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition';

        card.innerHTML = `
          <div class="flex items-center gap-2 mb-2 text-xs">
            <span class="bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded">${item.feedName}</span>
            ${item.pubDate ? `<span class="text-gray-400"><i class="fa-regular fa-clock"></i> ${item.pubDate}</span>` : ''}
          </div>
          <h2 class="text-base font-bold text-gray-900 mb-2 hover:text-blue-600">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
          </h2>
          ${item.description ? `<p class="text-xs text-gray-600 line-clamp-2 mb-3 leading-relaxed">${item.description}</p>` : ''}
          <div class="pt-2 border-t border-gray-100 text-xs">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-blue-600 font-medium hover:underline flex items-center gap-1">
              公式サイトで開く <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat, event) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-gray-800', 'text-white');
        btn.classList.add('bg-white', 'text-gray-700');
      });
      event.target.classList.remove('bg-white', 'text-gray-700');
      event.target.classList.add('bg-gray-800', 'text-white');
      renderNews();
    }

    loadNewsData();
  </script>
</body>
</html>
