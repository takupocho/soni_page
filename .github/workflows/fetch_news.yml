name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import urllib.request
          import feedparser
          import json
          import re
          from datetime import datetime, timezone

          feeds = [
              {"id": "press", "name": "プレスリリース", "url": "https://www.sony.co.jp/SonyInfo/News/Press/rss/index.xml"},
              {"id": "product", "name": "製品情報・新着", "url": "https://www.sony.jp/xml/news.xml"}
          ]

          items = []
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}

          for feed in feeds:
              try:
                  req = urllib.request.Request(feed["url"], headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      content = resp.read()
                  
                  parsed = feedparser.parse(content)
                  
                  for entry in parsed.entries:
                      title = getattr(entry, 'title', '').strip()
                      link = getattr(entry, 'link', '').strip()
                      guid = getattr(entry, 'id', link).strip()
                      
                      pub_date = getattr(entry, 'published', getattr(entry, 'updated', ''))
                      summary = getattr(entry, 'summary', getattr(entry, 'description', ''))
                      clean_desc = re.sub(r"<[^>]+>", "", summary).strip()
                      
                      if title and link:
                          items.append({
                              "id": guid,
                              "title": title,
                              "link": link,
                              "pubDate": pub_date,
                              "description": clean_desc,
                              "feedId": feed["id"],
                              "feedName": feed["name"]
                          })
              except Exception as e:
                  print(f"Error fetching {feed['name']}: {e}")

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"取得成功: 合計 {len(items)} 件")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && git push)
