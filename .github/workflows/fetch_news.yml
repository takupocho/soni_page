name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import json
          import re
          import sys
          import time
          from datetime import datetime, timezone

          feeds = [
              {
                  "id": "press",
                  "name": "プレスリリース",
                  "url": "https://prtimes.jp/companyrss/action.php?market_id=0&company_id=12968"
              },
              {
                  "id": "product",
                  "name": "製品ニュース",
                  "url": "https://news.google.com/rss/search?q=site:sony.jp+OR+site:sony.co.jp&hl=ja&gl=JP&ceid=JP:ja"
              },
              {
                  "id": "camera_update",
                  "name": "カメラ更新",
                  "url": "https://news.google.com/rss/search?q=site:sony.jp%2Fsupport%2F+%22%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88%22+OR+%22%E3%83%95%E3%82%A1%E3%83%BC%E3%83%A0%E3%82%A6%E3%82%A7%E3%82%A2%22&hl=ja&gl=JP&ceid=JP:ja"
              },
              {
                  "id": "xperia_update",
                  "name": "Xperia更新",
                  "url": "https://news.google.com/rss/search?q=(site:xperia.sony.jp+OR+%22Xperia%22)+%22%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88%22&hl=ja&gl=JP&ceid=JP:ja"
              },
              {
                  "id": "support",
                  "name": "サポート・全般",
                  "url": "https://news.google.com/rss/search?q=site:sony.jp%2Fsupport+OR+%22%E3%82%BD%E3%83%8B%E3%83%BC%22+%22%E3%82%A2%E3%83%83%E3%83%97%E3%83%87%E3%83%BC%E3%83%88%22&hl=ja&gl=JP&ceid=JP:ja"
              },
              {
                  "id": "store",
                  "name": "ストア・イベント",
                  "url": "https://news.google.com/rss/search?q=site:sony.jp%2Fstore+OR+site:sony.jp%2Finfo&hl=ja&gl=JP&ceid=JP:ja"
              }
          ]

          items = []
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          for feed in feeds:
              try:
                  res = requests.get(feed["url"], headers=headers, timeout=15)
                  if res.status_code == 200:
                      parsed = feedparser.parse(res.content)
                      print(f"[{feed['name']}] 取得成功: {len(parsed.entries)}件")
                      
                      for entry in parsed.entries[:15]:
                          title = entry.get("title", "").strip()
                          link = entry.get("link", "").strip()
                          pub_date = entry.get("published", entry.get("updated", ""))
                          
                          parsed_time = entry.get("published_parsed") or entry.get("updated_parsed")
                          timestamp = time.mktime(parsed_time) if parsed_time else 0

                          summary = entry.get("summary", entry.get("description", ""))
                          clean_desc = re.sub(r"<[^>]+>", "", summary).strip()

                          if title and link:
                              items.append({
                                  "id": link,
                                  "title": title,
                                  "link": link,
                                  "pubDate": pub_date,
                                  "timestamp": timestamp,
                                  "description": clean_desc[:120] + "..." if len(clean_desc) > 120 else clean_desc,
                                  "feedId": feed["id"],
                                  "feedName": feed["name"]
                              })
              except Exception as e:
                  print(f"[{feed['name']}] 例外発生: {e}")

          # 全体を最新日時順（降順）にソート
          items.sort(key=lambda x: x["timestamp"], reverse=True)

          print(f"合計取得件数: {len(items)}件")

          if len(items) == 0:
              print("エラー: 記事データが0件のため処理を中止します。")
              sys.exit(1)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sony_news.json の書き出しに成功しました。")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && git push)
