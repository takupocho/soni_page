name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import requests
          import json
          import re
          from datetime import datetime, timezone

          feeds = [
              {"id": "press", "name": "プレスリリース", "url": "https://www.sony.co.jp/SonyInfo/News/Press/rss/index.xml"},
              {"id": "product", "name": "製品情報・新着", "url": "https://www.sony.jp/xml/news.xml"}
          ]

          items = []
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          for feed in feeds:
              try:
                  res = requests.get(feed["url"], headers=headers, timeout=15)
                  # 文字化け防止のためバイナリからデコード
                  try:
                      content = res.content.decode('utf-8')
                  except UnicodeDecodeError:
                      content = res.content.decode('shift_jis', errors='ignore')
                  
                  # <item>タグをブロック単位で直接抽出
                  blocks = re.findall(r'<item[\s>](.*?)</item>', content, re.DOTALL | re.IGNORECASE)
                  print(f"[{feed['name']}] 検出ブロック数: {len(blocks)}")

                  for block in blocks:
                      title_m = re.search(r'<title.*?>(.*?)</title>', block, re.DOTALL | re.IGNORECASE)
                      link_m = re.search(r'<link.*?>(.*?)</link>', block, re.DOTALL | re.IGNORECASE)
                      date_m = re.search(r'<(?:pubDate|dc:date).*?>(.*?)</(?:pubDate|dc:date)>', block, re.DOTALL | re.IGNORECASE)
                      desc_m = re.search(r'<description.*?>(.*?)</description>', block, re.DOTALL | re.IGNORECASE)

                      def clean(val):
                          if not val: return ""
                          text = val.group(1).strip()
                          text = re.sub(r'<!\[CDATA\[(.*?)\]\]>', r'\1', text, flags=re.DOTALL)
                          return re.sub(r'<[^>]+>', '', text).strip()

                      title = clean(title_m)
                      link = clean(link_m)
                      pub_date = clean(date_m)
                      desc = clean(desc_m)

                      if title and link:
                          items.append({
                              "id": link,
                              "title": title,
                              "link": link,
                              "pubDate": pub_date,
                              "description": desc,
                              "feedId": feed["id"],
                              "feedName": feed["name"]
                          })
              except Exception as e:
                  print(f"[{feed['name']}] エラー: {e}")

          print(f"合計取得件数: {len(items)}件")

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sony_news.json を正常に生成しました。")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && push)
