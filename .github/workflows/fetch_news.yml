name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import json
          import re
          import sys
          from datetime import datetime, timezone

          feeds = [
              {"id": "press", "name": "プレスリリース", "url": "https://www.sony.co.jp/SonyInfo/News/Press/rss/index.xml"},
              {"id": "product", "name": "製品情報・新着", "url": "https://www.sony.jp/xml/news.xml"}
          ]

          items = []
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          }

          for feed in feeds:
              try:
                  res = requests.get(feed["url"], headers=headers, timeout=15)
                  print(f"[{feed['name']}] HTTPステータス: {res.status_code}")
                  
                  if res.status_code == 200:
                      parsed = feedparser.parse(res.content)
                      print(f"[{feed['name']}] 取得エントリー数: {len(parsed.entries)}")
                      
                      for entry in parsed.entries:
                          title = getattr(entry, 'title', '').strip()
                          link = getattr(entry, 'link', '').strip()
                          guid = getattr(entry, 'id', link).strip()
                          pub_date = getattr(entry, 'published', getattr(entry, 'updated', ''))
                          summary = getattr(entry, 'summary', getattr(entry, 'description', ''))
                          clean_desc = re.sub(r"<[^>]+>", "", summary).strip()
                          
                          if title and link:
                              items.append({
                                  "id": guid,
                                  "title": title,
                                  "link": link,
                                  "pubDate": pub_date,
                                  "description": clean_desc,
                                  "feedId": feed["id"],
                                  "feedName": feed["name"]
                              })
                  else:
                      print(f"[{feed['name']}] 通信エラー (HTTP {res.status_code})")
              except Exception as e:
                  print(f"[{feed['name']}] 例外発生: {e}")

          print(f"合計取得件数: {len(items)} 件")

          if len(items) == 0:
              print("エラー: 記事データが0件のためJSONの更新を中断します。")
              sys.exit(1)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sony_news.json の書き出しに成功しました。")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && git push)
