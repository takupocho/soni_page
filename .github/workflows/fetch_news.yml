name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import json
          import re
          import sys
          import urllib.parse
          from datetime import datetime, timezone

          feeds = [
              {"id": "press", "name": "プレスリリース", "url": "https://www.sony.co.jp/SonyInfo/News/Press/rss/index.xml"},
              {"id": "product", "name": "製品情報・新着", "url": "https://www.sony.jp/xml/news.xml"}
          ]

          items = []
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          }

          for feed in feeds:
              content = None
              
              # 1. 直接取得の試行
              try:
                  res = requests.get(feed["url"], headers=headers, timeout=10)
                  if res.status_code == 200 and len(res.content) > 100:
                      content = res.content
                      print(f"[{feed['name']}] 直接取得成功")
              except Exception as e:
                  print(f"[{feed['name']}] 直接取得失敗: {e}")

              # 2. 直接取得が失敗した場合はプロキシ経由で試行
              if not content:
                  try:
                      encoded_url = urllib.parse.quote(feed["url"], safe='')
                      proxy_url = f"https://api.allorigins.win/raw?url={encoded_url}"
                      res = requests.get(proxy_url, headers=headers, timeout=10)
                      if res.status_code == 200:
                          content = res.content
                          print(f"[{feed['name']}] プロキシ経由で取得成功")
                  except Exception as e:
                      print(f"[{feed['name']}] プロキシ取得失敗: {e}")

              # 3. RSSの解析
              if content:
                  parsed = feedparser.parse(content)
                  print(f"[{feed['name']}] 解析エントリー数: {len(parsed.entries)}")
                  for entry in parsed.entries:
                      title = entry.get("title", "").strip()
                      link = entry.get("link", "").strip()
                      pub_date = entry.get("published", entry.get("updated", ""))
                      summary = entry.get("summary", entry.get("description", ""))
                      clean_desc = re.sub(r"<[^>]+>", "", summary).strip()

                      if title and link:
                          items.append({
                              "id": link,
                              "title": title,
                              "link": link,
                              "pubDate": pub_date,
                              "description": clean_desc,
                              "feedId": feed["id"],
                              "feedName": feed["name"]
                          })

          print(f"合計取得件数: {len(items)}件")

          if len(items) == 0:
              print("エラー: 記事データが0件のためファイルの書き換えを中止します。")
              sys.exit(1)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sony_news.json を正常に更新しました。")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && git push)
