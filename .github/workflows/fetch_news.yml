name: Fetch Sony RSS to sony_news.json

on:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動更新
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Sony RSS and Output JSON
        run: |
          python3 << 'EOF'
          import requests
          import json
          import re
          import sys
          import urllib.parse
          from datetime import datetime, timezone

          feeds = [
              {"id": "press", "name": "プレスリリース", "url": "https://www.sony.co.jp/SonyInfo/News/Press/rss/index.xml"},
              {"id": "product", "name": "製品情報・新着", "url": "https://www.sony.jp/xml/news.xml"}
          ]

          items = []

          for feed in feeds:
              encoded_url = urllib.parse.quote(feed["url"], safe='')
              api_url = f"https://api.rss2json.com/v1/api.json?rss_url={encoded_url}"
              
              try:
                  res = requests.get(api_url, timeout=15)
                  if res.status_code == 200:
                      data = res.json()
                      if data.get("status") == "ok":
                          raw_items = data.get("items", [])
                          print(f"[{feed['name']}] 取得成功: {len(raw_items)}件")
                          
                          for entry in raw_items:
                              title = entry.get("title", "").strip()
                              link = entry.get("link", "").strip()
                              guid = entry.get("guid", link).strip()
                              pub_date = entry.get("pubDate", "")
                              desc = entry.get("description", "")
                              clean_desc = re.sub(r"<[^>]+>", "", desc).strip()
                              
                              if title and link:
                                  items.append({
                                      "id": guid,
                                      "title": title,
                                      "link": link,
                                      "pubDate": pub_date,
                                      "description": clean_desc,
                                      "feedId": feed["id"],
                                      "feedName": feed["name"]
                                  })
                      else:
                          print(f"[{feed['name']}] APIエラー: {data.get('message')}")
                  else:
                      print(f"[{feed['name']}] 通信エラー HTTP: {res.status_code}")
              except Exception as e:
                  print(f"[{feed['name']}] 例外発生: {e}")

          print(f"合計取得件数: {len(items)}件")

          if len(items) == 0:
              print("エラー: データが取得できませんでした。")
              sys.exit(1)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "items": items
          }

          with open("sony_news.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sony_news.json の書き出しが正常完了しました。")
          EOF

      - name: Commit and Push sony_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sony_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sony_news.json [skip ci]" && git push)
